# Entorno conda «osemosys» con las versiones exactas del entorno en que se corrieron el modelo y la etapa de
# Artículo 6 (exportado con «conda env export --no-builds» el 13-10-2026; Windows de 64 bits).
# Crear:   conda env create -f environment.yml      (ejecutar_modelo.bat lo hace si el entorno no existe)
# pandas va fijo en 2.2.3 y sin pyarrow; kaleido 0.2.1 exporta las gráficas PNG de Plotly. Se omite el metapaquete
# cpython=3.13.3 del entorno original, que choca con python=3.13.2 al resolver.
# Si el canal defaults pide aceptar sus términos: conda tos accept (ver README.md).
