# Read the Docs: compila la documentación Sphinx de docs/. Las tablas, fichas y figuras de docs/_generado y
# docs/_static las escribe B3 en cada corrida y van versionadas, de modo que la compilación no corre el modelo.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
